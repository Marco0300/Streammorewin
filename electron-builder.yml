appId: com.streammore.desktop
productName: Streammore
executableName: streammore
artifactName: Streammore-${version}-${arch}.${ext}

copyright: Copyright © 2026 Streammore

files:
  - main.cjs
  - preload.cjs
  - responsive.css
  - package.json
  - assets/**

asar: true
npmRebuild: false
asarUnpack:
  - node_modules/electron-vlc-player/build/Release/*.node

extraResources:
  - from: vendor/vlc
    to: vendor/vlc

win:
  signAndEditExecutable: true
  signingHashAlgorithms: [sha256]
  rfc3161TimeStampServer: http://timestamp.digicert.com
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  icon: assets/streammore-icon.png
  artifactName: Streammore-${version}-${arch}.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Streammore
  artifactName: Streammore-Setup-${version}-${arch}.${ext}

portable:
  artifactName: Streammore-Portable-${version}-${arch}.${ext}

directories:
  output: dist
  buildResources: assets

publish:
  provider: github
  owner: Marco0300
  repo: Streammorewin
  releaseType: release
