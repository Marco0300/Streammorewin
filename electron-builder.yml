appId: com.streammore.desktop
productName: Streammore
executableName: streammore
artifactName: Streammore-${version}-${arch}.${ext}

copyright: Copyright © 2026 Streammore

files:
  - main.cjs
  - portable-update.cjs
  - preload.cjs
  - responsive.css
  - package.json
  - assets/**

asar: true
npmRebuild: false
asarUnpack:
  - node_modules/electron-vlc-player/build/Release/*.node

extraResources:
  - from: vendor/vlc
    to: vendor/vlc

win:
  # This release is intentionally unsigned. Add a Windows code-signing
  # certificate later and switch this to true before publishing a trusted build.
  signAndEditExecutable: false
  # Signing options must live under signtoolOptions: electron-builder 26 rejects
  # unknown keys inside win (additionalProperties: false). They are inert while
  # signAndEditExecutable is false, and are used as soon as a certificate is
  # supplied through the CSC_LINK / CSC_KEY_PASSWORD environment variables.
  signtoolOptions:
    signingHashAlgorithms: [sha256]
    rfc3161TimeStampServer: http://timestamp.digicert.com
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  icon: assets/streammore-icon.png
  artifactName: Streammore-${version}-${arch}.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Streammore
  artifactName: Streammore-Setup-${version}-${arch}.${ext}

portable:
  artifactName: Streammore-Portable-${version}-${arch}.${ext}

directories:
  output: dist
  buildResources: assets

publish:
  provider: github
  owner: Marco0300
  repo: Streammorewin
  releaseType: release
