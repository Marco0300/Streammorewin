name: Build Streammore Windows

on:
  workflow_dispatch:
  push:
    paths:
      - "**"
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Use HTTPS for public npm git dependencies
        shell: bash
        run: |
          git config --global url."https://github.com/".insteadOf "git+ssh://git@github.com/"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - name: Install dependencies
        run: npm ci
      - name: Rebuild VLC native binding for Electron
        run: npx --yes @electron/rebuild@3 -f -w electron-vlc-player
      - name: Validate desktop shell
        run: npm run check
      - name: Bundle VLC 3 runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $vlcVersion = "3.0.21"
          $log = New-Object System.Collections.Generic.List[string]

          $extractDir = Join-Path $PWD "vlc-extracted"
          Remove-Item -Recurse -Force $extractDir -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $extractDir | Out-Null

          function Get-Libvlc {
            param([string]$Root)
            return Get-ChildItem -Path $Root -Filter "libvlc.dll" -Recurse -Force -ErrorAction SilentlyContinue | Select-Object -First 1
          }

          $lib = $null

          # Attempt 1: canonical 7z archive via the bundled 7-Zip (VLC's primary Windows package)
          try {
            $sevenZip = @(
              "C:\Program Files\7-Zip\7z.exe",
              "C:\Program Files (x86)\7-Zip\7z.exe"
            ) | Where-Object { Test-Path $_ } | Select-Object -First 1
            if ($null -eq $sevenZip) {
              $found = Get-Command 7z.exe -ErrorAction SilentlyContinue
              if ($found) { $sevenZip = $found.Source }
            }
            if ($null -eq $sevenZip) {
              $log.Add("7z: not available")
            } else {
              $archive7z = "vlc-$vlcVersion-win64.7z"
              Invoke-WebRequest -Uri "https://get.videolan.org/vlc/$vlcVersion/win64/$archive7z" -OutFile $archive7z
              $log.Add("7z: downloaded $((Get-Item $archive7z).Length) bytes via $sevenZip")
              & $sevenZip x $archive7z "-o$extractDir" -y -bso0 -bsp0
              $log.Add("7z: exit $LASTEXITCODE")
              $lib = Get-Libvlc -Root $extractDir
              $log.Add("7z: libvlc.dll = $(if ($lib) { $lib.FullName } else { 'NOT FOUND' })")
            }
          } catch {
            $log.Add("7z: FAILED $($_.Exception.Message)")
          }

          # Attempt 2: zip archive via Expand-Archive
          if ($null -eq $lib) {
            try {
              $archiveZip = "vlc-$vlcVersion-win64.zip"
              Invoke-WebRequest -Uri "https://get.videolan.org/vlc/$vlcVersion/win64/$archiveZip" -OutFile $archiveZip
              $log.Add("zip: downloaded $((Get-Item $archiveZip).Length) bytes")
              Expand-Archive -LiteralPath (Join-Path $PWD $archiveZip) -DestinationPath $extractDir -Force -ErrorAction Stop
              $log.Add("zip: Expand-Archive completed")
              $lib = Get-Libvlc -Root $extractDir
              $log.Add("zip: libvlc.dll = $(if ($lib) { $lib.FullName } else { 'NOT FOUND' })")
            } catch {
              $log.Add("zip: FAILED $($_.Exception.Message)")
            }
          }

          # Diagnostics: surface the top-level extraction tree through annotations (readable via the API)
          $tree = Get-ChildItem -Path $extractDir -Force -ErrorAction SilentlyContinue |
            Select-Object -First 12 -ExpandProperty Name
          $log.Add("tree: $($tree -join ', ')")

          foreach ($line in $log) {
            Write-Host "::warning title=VLC-DIAG::$(($line -replace "`r?`n", ' '))"
          }

          if ($null -eq $lib) { throw "libvlc.dll was not found in the extracted VLC runtime" }

          New-Item -ItemType Directory -Force vendor/vlc | Out-Null
          Copy-Item -Path (Join-Path $lib.Directory.FullName '*') -Destination vendor/vlc -Recurse -Force
          if (!(Test-Path vendor/vlc/plugins)) { throw "VLC plugins directory was not bundled" }
          Write-Host "::warning title=VLC-DIAG::bundled from $($lib.Directory.FullName)"
          Write-Host "Bundled VLC runtime from $($lib.Directory.FullName)"
      - name: Remove stale build output
        shell: pwsh
        run: Remove-Item -Recurse -Force dist -ErrorAction SilentlyContinue
      - name: Build Windows installers
        run: npm run dist:win
      - name: Verify Windows artifacts
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -like 'v*' -and $env:GITHUB_REF_NAME -ne "v$version") { throw "Git tag does not match desktop package version" }
          $setup = Get-ChildItem dist/Streammore-Setup-*-x64.exe | Select-Object -First 1
          $portable = Get-ChildItem dist/Streammore-Portable-*-x64.exe | Select-Object -First 1
          $metadata = Get-ChildItem dist/latest.yml | Select-Object -First 1
          if ($null -eq $setup -or $setup.Length -lt 10MB) { throw "Installer is missing or suspiciously small" }
          if ($null -eq $portable -or $portable.Length -lt 50MB) { throw "Portable executable is missing or suspiciously small" }
          if ($null -eq $metadata -or $metadata.Length -lt 100) { throw "Electron update metadata latest.yml is missing" }
          Get-FileHash $setup.FullName -Algorithm SHA256
          Get-FileHash $portable.FullName -Algorithm SHA256
      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: streammore-windows-${{ github.sha }}
          path: |
            dist/*.exe
          if-no-files-found: error
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.exe
            dist/latest*.yml
            dist/*.blockmap
