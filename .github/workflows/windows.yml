name: Build Streammore Windows

on:
  workflow_dispatch:
  push:
    paths:
      - "**"
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Use HTTPS for public npm git dependencies
        shell: bash
        run: |
          git config --global url."https://github.com/".insteadOf "git+ssh://git@github.com/"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - name: Install dependencies
        run: npm ci
      - name: Rebuild VLC native binding for Electron
        run: npx --yes @electron/rebuild@3 -f -w electron-vlc-player
      - name: Validate desktop shell
        run: npm run check
      - name: Bundle VLC 3 runtime
        shell: pwsh
        run: |
          $vlcVersion = "3.0.21"
          $archive = "vlc-$vlcVersion-win64.7z"
          Invoke-WebRequest -Uri "https://get.videolan.org/vlc/$vlcVersion/win64/$archive" -OutFile $archive
          7z x $archive -ovlc-extracted -y | Out-Null
          $lib = Get-ChildItem -Path vlc-extracted -Filter libvlc.dll -Recurse | Select-Object -First 1
          if ($null -eq $lib) { throw "libvlc.dll was not found in the VLC archive" }
          New-Item -ItemType Directory -Force vendor/vlc | Out-Null
          Copy-Item "$($lib.Directory.FullName)/*" vendor/vlc -Recurse -Force
          if (!(Test-Path vendor/vlc/plugins)) { throw "VLC plugins directory was not bundled" }
      - name: Require signing certificate for tagged releases
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CODE_SIGNING_CERTIFICATE_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CODE_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CSC_LINK)) { throw "WINDOWS_CODE_SIGNING_CERTIFICATE_BASE64 secret is missing" }
          if ([string]::IsNullOrWhiteSpace($env:CSC_KEY_PASSWORD)) { throw "WINDOWS_CODE_SIGNING_CERTIFICATE_PASSWORD secret is missing" }
      - name: Remove stale build output
        shell: pwsh
        run: Remove-Item -Recurse -Force dist -ErrorAction SilentlyContinue
      - name: Build Windows installers
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CODE_SIGNING_CERTIFICATE_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CODE_SIGNING_CERTIFICATE_PASSWORD }}
        run: npm run dist:win
      - name: Verify Windows artifacts
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -like 'v*' -and $env:GITHUB_REF_NAME -ne "v$version") { throw "Git tag does not match desktop package version" }
          $setup = Get-ChildItem dist/Streammore-Setup-*-x64.exe | Select-Object -First 1
          $portable = Get-ChildItem dist/Streammore-Portable-*-x64.exe | Select-Object -First 1
          $metadata = Get-ChildItem dist/latest.yml | Select-Object -First 1
          if ($null -eq $setup -or $setup.Length -lt 10MB) { throw "Installer is missing or suspiciously small" }
          if ($null -eq $portable -or $portable.Length -lt 50MB) { throw "Portable executable is missing or suspiciously small" }
          if ($null -eq $metadata -or $metadata.Length -lt 100) { throw "Electron update metadata latest.yml is missing" }
          Get-FileHash $setup.FullName -Algorithm SHA256
          Get-FileHash $portable.FullName -Algorithm SHA256
      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: streammore-windows-${{ github.sha }}
          path: |
            dist/*.exe
          if-no-files-found: error
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.exe
            dist/latest*.yml
            dist/*.blockmap
