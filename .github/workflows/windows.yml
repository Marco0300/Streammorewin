name: Build Streammore Windows

on:
  workflow_dispatch:
  push:
    paths:
      - "**"
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Use HTTPS for public npm git dependencies
        shell: bash
        run: |
          git config --global url."https://github.com/".insteadOf "git+ssh://git@github.com/"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
      - name: Install dependencies
        run: npm ci
      - name: Rebuild VLC native binding for Electron
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          npx --yes @electron/rebuild@3 -f -w electron-vlc-player
          if ($LASTEXITCODE -ne 0) { throw "electron-rebuild failed with exit code $LASTEXITCODE" }
          $binding = "node_modules/electron-vlc-player/build/Release/vlc_binding.node"
          if (!(Test-Path $binding)) { throw "Native VLC binding was not built at $binding" }
          Write-Host "Native VLC binding built: $((Get-Item $binding).Length) bytes"
      - name: Validate desktop shell
        run: npm run check
      - name: Bundle VLC 3 runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $vlcVersion = "3.0.21"
          $expectedSha = "9d2b24d6bc4196b3da8d181a3878678ba272e2a7690321f8826da76a69b2fb9c"
          $archive = "vlc-$vlcVersion-win64.7z"
          $url = "https://get.videolan.org/vlc/$vlcVersion/win64/$archive"

          # VideoLAN answers non-browser user agents with an HTML "download will start"
          # interstitial (~29 KB, HTTP 200) that lists mirrors instead of the runtime, so
          # PowerShell's Invoke-WebRequest cannot fetch this file. curl.exe is shipped with
          # Windows and is handed the real archive.
          curl.exe -L --fail --retry 3 --retry-delay 2 -o $archive $url
          if ($LASTEXITCODE -ne 0) { throw "curl failed to download $url (exit $LASTEXITCODE)" }

          $size = (Get-Item $archive).Length
          if ($size -lt 10MB) { throw "Downloaded VLC runtime is only $size bytes; the real archive is about 37 MB" }

          $sha = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
          if ($sha -ne $expectedSha) { throw "VLC archive checksum mismatch: expected $expectedSha, got $sha" }
          Write-Host "VLC $vlcVersion runtime downloaded: $size bytes, sha256 $sha"

          $sevenZip = @(
            "C:\Program Files\7-Zip\7z.exe",
            "C:\Program Files (x86)\7-Zip\7z.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if ($null -eq $sevenZip) { throw "7-Zip is not available on this runner" }

          $extractDir = Join-Path $PWD "vlc-extracted"
          Remove-Item -Recurse -Force $extractDir -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $extractDir | Out-Null
          & $sevenZip x $archive "-o$extractDir" -y -bso0 -bsp0
          if ($LASTEXITCODE -ne 0) { throw "7-Zip failed to extract the VLC runtime (exit $LASTEXITCODE)" }

          $lib = Get-ChildItem -Path $extractDir -Filter "libvlc.dll" -Recurse -Force |
            Select-Object -First 1
          if ($null -eq $lib) { throw "libvlc.dll was not found in the extracted VLC runtime" }

          New-Item -ItemType Directory -Force vendor/vlc | Out-Null
          Copy-Item -Path (Join-Path $lib.Directory.FullName '*') -Destination vendor/vlc -Recurse -Force
          if (!(Test-Path vendor/vlc/libvlc.dll)) { throw "libvlc.dll was not copied into vendor/vlc" }
          if (!(Test-Path vendor/vlc/plugins)) { throw "VLC plugins directory was not bundled" }
          if (!(Test-Path vendor/vlc/libvlccore.dll)) { throw "libvlccore.dll was not bundled" }

          Write-Host "Bundled VLC $vlcVersion runtime from $($lib.Directory.FullName)"
          Get-ChildItem vendor/vlc | Select-Object -First 25 -ExpandProperty Name
      - name: Remove stale build output
        shell: pwsh
        run: Remove-Item -Recurse -Force dist -ErrorAction SilentlyContinue
      - name: Build Windows installers
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          npm run dist:win 2>&1 | Tee-Object -FilePath build.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $all = Get-Content build.log | Where-Object { $_ -match '\S' }
            $hits = $all | Where-Object { $_ -match 'error|Error|cannot|Cannot|failed|ENOENT|EPERM|not found|must be' } | Select-Object -Last 10
            if ($hits.Count -lt 3) { $hits = $all | Select-Object -Last 10 }
            foreach ($line in $hits) {
              Write-Host "::warning title=DIST-DIAG::$(($line -replace "`r?`n", ' '))"
            }
            throw "electron-builder failed with exit code $code"
          }
      - name: Verify Windows artifacts
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -like 'v*' -and $env:GITHUB_REF_NAME -ne "v$version") { throw "Git tag does not match desktop package version" }
          $setup = Get-ChildItem dist/Streammore-Setup-*-x64.exe | Select-Object -First 1
          $portable = Get-ChildItem dist/Streammore-Portable-*-x64.exe | Select-Object -First 1
          $metadata = Get-ChildItem dist/latest.yml | Select-Object -First 1
          if ($null -eq $setup -or $setup.Length -lt 10MB) { throw "Installer is missing or suspiciously small" }
          if ($null -eq $portable -or $portable.Length -lt 50MB) { throw "Portable executable is missing or suspiciously small" }
          if ($null -eq $metadata -or $metadata.Length -lt 100) { throw "Electron update metadata latest.yml is missing" }

          # Verify the packaged layout actually contains the native MKV player parts
          $packagedVlc = "dist/win-unpacked/resources/vendor/vlc"
          $packagedBinding = "dist/win-unpacked/resources/app.asar.unpacked/node_modules/electron-vlc-player/build/Release/vlc_binding.node"
          if (!(Test-Path "$packagedVlc/libvlc.dll")) { throw "Packaged app is missing vendor/vlc/libvlc.dll" }
          if (!(Test-Path "$packagedVlc/libvlccore.dll")) { throw "Packaged app is missing vendor/vlc/libvlccore.dll" }
          if (!(Test-Path "$packagedVlc/plugins")) { throw "Packaged app is missing the VLC plugins directory" }
          if (!(Test-Path $packagedBinding)) { throw "Packaged app is missing the unpacked native VLC binding" }
          Write-Host "Packaged VLC runtime: $packagedVlc"
          Write-Host "Packaged native binding: $packagedBinding"

          Get-FileHash $setup.FullName -Algorithm SHA256
          Get-FileHash $portable.FullName -Algorithm SHA256
      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: streammore-windows-${{ github.sha }}
          path: |
            dist/*.exe
          if-no-files-found: error
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.exe
            dist/latest*.yml
            dist/*.blockmap
